parameters:
  # Pinned DOWN to match UnoCheck_Version, and verified against the tool: uno.check ships its
  # manifest as an EMBEDDED resource, so the live one in unoplatform/uno.check is irrelevant.
  # 1.34.1 embeds WASMTOOLS_VERSION '10.0.101/10.0.100', and provisioning wasm-tools therefore
  # installs mono.toolchain.current 10.0.101. On SDK 10.0.102 that manifest sits BELOW the SDK,
  # the resolver asks for a Microsoft.NET.Runtime.MonoTargets.Sdk that was never installed, and
  # every net10.0-ios library build fails NETSDK1147 (invisible while the libraries targeted
  # net9.0, which resolves through mono.toolchain.net9). Raising the SDK requires raising
  # uno.check with it -- see the tracking issue; do not bump one alone.
  DotNetVersion: '10.0.101'
  UnoCheck_Version: '1.34.1'
  UnoCheckParameters: ''

steps:
  - template: dotnet-install.yml
    parameters:
      UnoCheckParameters: '${{ parameters.UnoCheckParameters }}'
      UnoCheck_Version: '${{ parameters.UnoCheck_Version }}'
      DotNetVersion: '${{ parameters.DotNetVersion }}'

  - powershell: |
      & dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
      & uno-check -v --ci --non-interactive --fix --skip xcode --skip gtk3 --skip vswin --skip androidemulator --skip androidsdk --skip dotnetnewunotemplates --skip unosdk --skip vsmac ${{ parameters.UnoCheckParameters }}
    displayName: Install .NET Workloads
    errorActionPreference: continue
    ignoreLASTEXITCODE: true
    retryCountOnTaskFailure: 3
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))
